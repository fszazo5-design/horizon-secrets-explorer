name: Deploy Cloudflare Worker and KV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/cloudflare-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker and KV
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: horizon-secrets-sync
      KV_TITLE: horizon-secrets-progress
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install --global wrangler@3.114.17

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          wrangler whoami

      - name: Create or find KV namespace
        id: kv
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          namespaces="$(curl --fail --silent --show-error --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Content-Type: application/json' "$api")"
          namespace_id="$(printf '%s' "$namespaces" | jq -r --arg title "$KV_TITLE" '.result[] | select(.title == $title) | .id' | head -n 1)"
          if [ -z "$namespace_id" ] || [ "$namespace_id" = "null" ]; then
            created="$(curl --fail --silent --show-error --request POST --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Content-Type: application/json' --data "{\"title\":\"$KV_TITLE\"}" "$api")"
            namespace_id="$(printf '%s' "$created" | jq -r '.result.id')"
          fi
          test -n "$namespace_id"
          test "$namespace_id" != "null"
          echo "namespace_id=$namespace_id" >> "$GITHUB_OUTPUT"
          echo "KV namespace ready: $KV_TITLE"

      - name: Generate deployment config
        working-directory: worker
        env:
          NAMESPACE_ID: ${{ steps.kv.outputs.namespace_id }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          source = Path('wrangler.toml').read_text()
          source = source.replace('REPLACE_WITH_KV_NAMESPACE_ID', os.environ['NAMESPACE_ID'])
          Path('wrangler.deploy.toml').write_text(source)
          PY

      - name: Deploy Worker
        id: deploy
        working-directory: worker
        run: |
          set -euo pipefail
          wrangler deploy --config=wrangler.deploy.toml
          subdomain="$(curl --fail --silent --show-error --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')"
          test -n "$subdomain"
          test "$subdomain" != "null"
          worker_url="https://${WORKER_NAME}.${subdomain}.workers.dev"
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Verify Worker health
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 5 --silent --show-error "$WORKER_URL/health"
          {
            echo '## Cloudflare deployment'
            echo "- Worker: \\`$WORKER_URL\\`"
            echo "- Sync URL: \\`$WORKER_URL/sync\\`"
            echo "- KV namespace: \\`$KV_TITLE\\`"
            echo ''
            echo 'Set this GitHub Pages variable after verifying the URL:'
            echo '\\`VITE_CLOUDFLARE_SYNC_URL=$WORKER_URL/sync\\`'
          } >> "$GITHUB_STEP_SUMMARY"
