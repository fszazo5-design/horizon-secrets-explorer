name: Deploy Cloudflare Worker and D1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/cloudflare-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Worker and D1
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: horizon-secrets-sync
      D1_NAME: horizon-secrets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install --global wrangler@3.114.17

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          wrangler whoami

      - name: Create or find D1 database
        id: d1
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          databases="$(wrangler d1 list --json)"
          database_id="$(printf '%s' "$databases" | jq -r --arg name "$D1_NAME" '.[] | select(.name == $name) | .uuid' | head -n 1)"
          if [ -z "$database_id" ] || [ "$database_id" = "null" ]; then
            created="$(wrangler d1 create "$D1_NAME" --json)"
            database_id="$(printf '%s' "$created" | jq -r '.database_id // .uuid')"
          fi
          test -n "$database_id"
          test "$database_id" != "null"
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "D1 database ready: $D1_NAME"

      - name: Generate deployment config
        working-directory: worker
        env:
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          source = Path('wrangler.toml').read_text()
          source = source.replace('REPLACE_WITH_D1_DATABASE_ID', os.environ['DATABASE_ID'])
          Path('wrangler.deploy.toml').write_text(source)
          PY

      - name: Apply D1 schema
        working-directory: worker
        run: wrangler d1 execute "$D1_NAME" --remote --file=schema.sql --config=wrangler.deploy.toml

      - name: Deploy Worker
        id: deploy
        working-directory: worker
        run: |
          set -euo pipefail
          output="$(wrangler deploy --config=wrangler.deploy.toml 2>&1 | tee /dev/stderr)"
          worker_url="$(printf '%s\n' "$output" | grep -Eo 'https://[^ ]+workers\.dev' | tail -n 1 || true)"
          if [ -z "$worker_url" ]; then
            worker_url="https://${WORKER_NAME}.${CLOUDFLARE_ACCOUNT_ID}.workers.dev"
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Verify Worker health
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 5 --silent --show-error "$WORKER_URL/health"
          {
            echo '## Cloudflare deployment'
            echo "- Worker: \\`$WORKER_URL\\`"
            echo "- Sync URL: \\`$WORKER_URL/sync\\`"
            echo "- D1 database: \\`$D1_NAME\\`"
            echo ''
            echo 'Set this GitHub Pages variable after verifying the URL:'
            echo '\\`VITE_CLOUDFLARE_SYNC_URL=$WORKER_URL/sync\\`'
          } >> "$GITHUB_STEP_SUMMARY"
