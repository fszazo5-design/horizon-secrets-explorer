name: Deploy Game to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish game
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: stor
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Pages
        run: pnpm run build:cloudflare

      - name: Install Wrangler
        run: npm install --global wrangler@3.114.17

      - name: Validate Cloudflare access
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          wrangler whoami

      - name: Publish production deployment
        run: |
          wrangler pages deploy dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "${GITHUB_SHA} ${GITHUB_REF_NAME}"

      - name: Write deployment summary
        run: |
          {
            echo '## Cloudflare Pages OTA deployment'
            echo '- Project: `stor`'
            echo '- URL: https://stor-ayx.pages.dev'
            echo "- Commit: \\`${GITHUB_SHA}\\`"
            echo '- Future pushes to `main` publish automatically.'
          } >> "$GITHUB_STEP_SUMMARY"
