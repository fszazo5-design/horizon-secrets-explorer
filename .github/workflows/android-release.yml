name: Build Signed Android Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing key
        env:
          HORIZON_KEYSTORE_B64: ${{ secrets.HORIZON_KEYSTORE_B64 }}
        run: |
          test -n "$HORIZON_KEYSTORE_B64"
          echo "$HORIZON_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/horizon-upload.jks"
          {
            echo "HORIZON_STORE_FILE=$RUNNER_TEMP/horizon-upload.jks"
            echo "HORIZON_STORE_PASSWORD=${{ secrets.HORIZON_STORE_PASSWORD }}"
            echo "HORIZON_KEY_ALIAS=${{ secrets.HORIZON_KEY_ALIAS }}"
            echo "HORIZON_KEY_PASSWORD=${{ secrets.HORIZON_KEY_PASSWORD }}"
          } >> "$HOME/.gradle/gradle.properties"
      - run: gradle assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-secrets-release
          path: |
            android-native/app/build/outputs/bundle/release/app-release.aab
            android-native/app/build/outputs/apk/release/app-release.apk
